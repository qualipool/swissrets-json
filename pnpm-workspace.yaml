# pnpm security controls
# https://pnpm.io/blog/2025/12/05/newsroom-npm-supply-chain-security

# Block lifecycle scripts (preinstall/postinstall) by default.
# Installation fails immediately if a package has scripts, forcing a conscious allow/deny decision.
# No packages in this project currently require lifecycle scripts.
strictDepBuilds: true

allowBuilds:
  '@parcel/watcher': false

overrides:
  fast-uri: '>=3.1.2'

# Block packages published within the last 7 days (10080 minutes).
# Gives the community time to detect and remove malicious packages before they reach CI.
minimumReleaseAge: 10080

# Block packages where a newer version has weaker publish authentication than a previous version.
# Catches compromised maintainer accounts that publish outside of CI/CD.
trustPolicy: "no-downgrade"

minimumReleaseAgeExclude:
  - '@types/node@26.6.10'
  - '@typescript-eslint/eslint-plugin@8.74.0'
  - '@typescript-eslint/parser@8.74.0'
  - '@typescript-eslint/project-service@8.74.0'
  - '@typescript-eslint/scope-manager@8.74.0'
  - '@typescript-eslint/tsconfig-utils@8.74.0'
  - '@typescript-eslint/type-utils@8.74.0'
  - '@typescript-eslint/types@8.74.0'
  - '@typescript-eslint/typescript-estree@8.74.0'
  - '@typescript-eslint/utils@8.74.0'
  - '@typescript-eslint/visitor-keys@8.74.0'
  - typescript-eslint@8.74.0

name: Sync schema to docs

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Copy schema to docs
        run: cp schema/swissRetsSchema.json docs/swissRetsSchema.json

      - name: Commit and push if changed
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: 'chore: sync schema to docs'
          add: 'docs/swissRetsSchema.json'
          default_author: github_actions
